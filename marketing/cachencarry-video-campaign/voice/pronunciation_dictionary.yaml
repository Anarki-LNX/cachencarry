# Pronunciation dictionary for the German voice-over (Piper, thorsten-high).
#
# Applied ONLY to the spoken text, right before the speech engine
# (pipeline/voice.py, to_tts). Never to subtitles, on-screen text or documents.
#
#   term      display form (correct spelling)
#   match     optional regex; default: the term as a whole word, case-sensitive
#             (a hyphen counts as a word border, so "HIT-Einträge" matches HIT)
#   spoken    what the engine gets: a German respelling, or IPA in [[ ]]
#             (Piper hands [[ ]] straight to the model, no eSpeak guessing)
#   language  en = English pronunciation, de = German pronunciation
#   class     brand, product, software, tech, abbrev, english, path
#   test      pipeline/pron_test.py with thorsten-high, whisper small, 3 carrier
#             sentences (voice/pron_test_report_runde1.md and _runde2.md).
#             Whisper only checks intelligibility. Listening decides.
#
# Order matters: longer terms first. Add project-specific terms at the end of
# their group. Words that are tested and fine as written go to "as_is".

version: 1
voice: de_DE-thorsten-high

pronunciations:
