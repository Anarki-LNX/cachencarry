# Candidates for the pronunciation test (pipeline/pron_test.py).
# term: display form. accept: regex on the lower-case whisper output that
# counts as correct (homophones like "cash" for "cache" are accepted, because
# whisper cannot hear the difference). Candidates in [[ ]] are IPA for Piper.
- term: Cache & Carry
  accept: (cache|cash|käsch)\s*(&|and|und|end|en)\s*(carry|kerry|kärri)
  cand:
  - Käsch änd Kärri
  - '[[kˈɛʃ ʔɛnt kˈɛɾi]]'
  - '[[kˈæʃ ʔɛnd kˈæɾi]]'
- term: Cache
  accept: cache|cash|käsch
  cand:
