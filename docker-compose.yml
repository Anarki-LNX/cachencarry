# UniCache - Docker Compose deployment
#
#   1. cp .env.example .env   and adjust (data directory, admin password)
#   2. docker compose up -d
#   3. open http://<host>:8080
#
# Works on a normal Docker host and inside a Proxmox LXC container with
# nesting enabled (see docs/DEPLOYMENT.md). No privileged mode, no host
# network, no extra capabilities are needed.

services:
  unicache:
    image: ghcr.io/anarki-lnx/unicache:${UNICACHE_VERSION:-latest}
    build:
      context: .
      args:
        VERSION: ${UNICACHE_VERSION:-dev}
    container_name: unicache
    restart: unless-stopped
    ports:
      - "${UNICACHE_PORT:-8080}:8080"
    environment:
      # Creates the first administrator on the very first start. Leave it
      # empty to use the setup wizard with the one-time token instead:
      #   docker compose exec unicache unicache setup-token
      UNICACHE_SECURITY_ADMIN_PASSWORD: ${UNICACHE_ADMIN_PASSWORD:-}
      UNICACHE_STORAGE_MAX_SIZE: ${UNICACHE_MAX_SIZE:-0}
      UNICACHE_STORAGE_MIN_FREE_SPACE: ${UNICACHE_MIN_FREE_SPACE:-10%}
      UNICACHE_LOGGING_LEVEL: ${UNICACHE_LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    volumes:
      # Cache data and metadata database. A named volume by default; set
      # UNICACHE_DATA_DIR in .env to an absolute path for a bind mount
      # (the directory must be writable for UID/GID 65532, or change
      # `user:` below).
      - ${UNICACHE_DATA_DIR:-unicache-data}:/var/lib/unicache
      # Optional configuration file: ./configs/config.yaml
      - ./configs:/etc/unicache:ro
    # user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${UNICACHE_MEMORY_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "/usr/local/bin/unicache", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  unicache-data:
