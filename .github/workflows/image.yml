# Container image: builds the Dockerfile for linux/amd64 and linux/arm64 and
# publishes it to ghcr.io/anarki-lnx/cachencarry.
#
#   push of a tag vX.Y.Z  -> tags X.Y.Z, X.Y and latest
#   manual run with a tag -> rebuilds that release (for example v0.2.1)
#
# Only the built-in GITHUB_TOKEN is used, no other secrets.

name: Image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v0.2.1'
        required: true

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/anarki-lnx/cachencarry

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not a release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # Emulation is only a fallback for older tags whose Dockerfile does not
      # cross-compile yet. The current Dockerfile builds arm64 natively.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest

      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cachencarry:smoke
          build-args: VERSION=${{ steps.tag.outputs.version }}

      - name: Smoke test
        run: |
          docker run -d --name cc -p 8080:8080 \
            -e CACHENCARRY_SECURITY_ADMIN_PASSWORD=ci-smoke-test-pw cachencarry:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              docker rm -f cc >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs cc
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 and arm64
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.tag.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
